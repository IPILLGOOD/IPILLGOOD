<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IPILLGOOD Flow Visualization</title>
  <style>
    :root {
      --ink: #143f34;
      --muted: #60776f;
      --line: #98b6aa;
      --green: #187455;
      --green-light: #e9f5ef;
      --amber: #ad6728;
      --amber-light: #fff3e5;
      --blue: #367894;
      --blue-light: #eaf4f8;
      --purple: #705d92;
      --purple-light: #f2eef8;
      --red: #af4e46;
      --red-light: #fff0ee;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #eef3f0;
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    body { padding: 24px 24px 50px; }

    .controls {
      position: relative;
      z-index: 10;
      display: flex;
      width: max-content;
      gap: 6px;
      margin: 0 auto 18px;
      padding: 6px;
      border: 1px solid #c9d8d2;
      border-radius: 999px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 6px 18px rgba(20,63,52,.12);
    }

    .controls button {
      border: 0;
      border-radius: 999px;
      padding: 9px 16px;
      color: var(--muted);
      background: transparent;
      font-weight: 800;
      cursor: pointer;
    }

    .controls button.active { color: white; background: var(--green); }

    .diagram {
      width: min(1500px, calc(100vw - 48px));
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #d4e0db;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 36px rgba(20,63,52,.1);
    }

    .diagram.hidden { display: none; }
    svg { display: block; width: 100%; height: auto; }

    .node rect, .node path.node-shape {
      stroke-width: 2;
      rx: 14;
      filter: drop-shadow(0 5px 8px rgba(20,63,52,.08));
    }

    .node text { fill: var(--ink); text-anchor: middle; }
    .node .title { font-size: 20px; font-weight: 850; }
    .node .sub { fill: var(--muted); font-size: 13px; font-weight: 650; }
    .node .tiny { fill: var(--muted); font-size: 12px; font-weight: 700; }
    .node.green rect { fill: var(--green-light); stroke: var(--green); }
    .node.green-strong rect { fill: var(--green); stroke: var(--green); }
    .node.green-strong text { fill: white; }
    .node.green-strong .sub { fill: rgba(255,255,255,.78); }
    .node.amber rect { fill: var(--amber-light); stroke: var(--amber); }
    .node.blue rect { fill: var(--blue-light); stroke: var(--blue); }
    .node.purple rect { fill: var(--purple-light); stroke: var(--purple); }
    .node.red rect { fill: var(--red-light); stroke: var(--red); }
    .node.neutral rect { fill: #f8faf9; stroke: #afc2ba; }

    .edge { fill: none; stroke: var(--line); stroke-width: 3; }
    .edge.strong { stroke: var(--green); stroke-width: 4; }
    .edge.amber { stroke: var(--amber); }
    .edge.blue { stroke: var(--blue); }
    .edge.purple { stroke: var(--purple); }
    .edge.red { stroke: var(--red); }
    .edge.dashed { stroke-dasharray: 8 7; }
    .edge-label { fill: var(--muted); font-size: 13px; font-weight: 800; text-anchor: middle; }

    .lane-label { fill: var(--ink); font-size: 18px; font-weight: 850; }
    .lane-sub { fill: var(--muted); font-size: 12px; font-weight: 650; }
    .section-label { fill: var(--green); font-size: 13px; font-weight: 900; letter-spacing: .12em; }
    .rule-text { fill: #6f481f; font-size: 14px; font-weight: 800; text-anchor: middle; }

    @media print {
      body { padding: 0; background: white; }
      .controls { display: none; }
      .diagram { width: 100%; border: 0; border-radius: 0; box-shadow: none; page-break-after: always; }
    }
  </style>
</head>

  <script>
    const buttons = [...document.querySelectorAll('[data-target]')];
    const diagrams = [...document.querySelectorAll('.diagram')];

    function showDiagram(id) {
      diagrams.forEach((diagram) => diagram.classList.toggle('hidden', diagram.id !== id));
      buttons.forEach((button) => button.classList.toggle('active', button.dataset.target === id));
      const url = new URL(location.href);
      const queryName = {
        'agent-flow': 'agent',
        'question-flow': 'question',
        'user-flow': 'user'
      }[id];
      url.searchParams.set('diagram', queryName);
      history.replaceState({}, '', url);
    }

    buttons.forEach((button) => button.addEventListener('click', () => showDiagram(button.dataset.target)));
    const requested = new URLSearchParams(location.search).get('diagram');
    if (requested === 'question') showDiagram('question-flow');
    if (requested === 'user') showDiagram('user-flow');
  </script>
