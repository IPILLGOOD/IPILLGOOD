name: Isolated full-cycle verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: isolated-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run current UI, API and account full-cycle verification
        run: npm run verify -- --account-full-cycle
      - name: Summarize verification stages
        if: always()
        run: |
          if [ -f verification-artifacts/verification.md ]; then
            cat verification-artifacts/verification.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Verification did not reach the runner. Check the setup and install steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            test-results/
            playwright-report/
            verification-artifacts/
          retention-days: 7
