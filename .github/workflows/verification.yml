name: Isolated full-cycle verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: isolated-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run current UI, API and account full-cycle verification
        run: npm run verify -- --account-full-cycle
      - name: Verify Cloudflare bundle
        run: npm run cf:build --workspace @care-atlas/front -- --skipNextBuild
      - name: Verify pill pipeline on actual Workers runtime (offline historical catalog)
        run: node --experimental-strip-types scripts/pill-photo-worker-smoke.mjs
      - name: Verify final response headers
        env:
          SESSION_SECRET: CI-only-random-session-secret-6PmwK7w4sR2bV9xQ
          IPILLGOOD_DEMO_MODE: "false"
        run: |
          npm run start --workspace @care-atlas/front -- --hostname 127.0.0.1 > /tmp/ipillgood-next.log 2>&1 &
          npm run qa:security-headers --workspace @care-atlas/front
      - name: Verify Cloudflare runtime responses
        run: |
          npx wrangler dev --config front/wrangler.jsonc --local --ip 127.0.0.1 --port 3105 --persist-to /tmp/ipillgood-worker-state > /tmp/ipillgood-worker.log 2>&1 &
          IPILLGOOD_BASE_URL=http://127.0.0.1:3105 npm run qa:security-headers --workspace @care-atlas/front
      - name: Summarize verification stages
        if: always()
        run: |
          if [ -f verification-artifacts/verification.md ]; then
            cat verification-artifacts/verification.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Verification did not reach the runner. Check the setup and install steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            test-results/
            playwright-report/
            verification-artifacts/
          retention-days: 7
